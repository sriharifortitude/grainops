{{- if .Values.secrets.create }}
# Development convenience only. In production set secrets.create=false and
# secrets.existingSecret to a Secret you manage (sealed-secrets, external
# secrets, SOPS -- anything that is not a value in a Helm release).
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "grainops.fullname" . }}
  labels:
    {{- include "grainops.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
{{- end }}
