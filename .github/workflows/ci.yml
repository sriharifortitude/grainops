name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Build the stack from pinned tags and run the smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: docker compose version
      - name: Configuration is valid
        run: cp .env.example .env && sed -i 's/change-me/ci-only-password/' .env && docker compose config --quiet
      - name: Smoke test
        run: bash scripts/smoke.sh
      - name: Keep the data-quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tablewarden-report
          path: reports/tablewarden.xml
          if-no-files-found: ignore
