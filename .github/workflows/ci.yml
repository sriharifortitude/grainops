name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose:
    name: Compose stack from pinned tags, end-to-end smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Configuration is valid
        run: cp .env.example .env && sed -i 's/change-me/ci-only-password/' .env && docker compose config --quiet
      - run: bash scripts/smoke.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tablewarden-report
          path: reports/tablewarden.xml
          if-no-files-found: ignore

  helm:
    name: Helm chart lint, schema check, kind end-to-end smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: azure/setup-helm@v4
      - name: kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          helm lint helm/grainops
          helm template ci helm/grainops | ./kubeconform -strict -summary -ignore-missing-schemas
          helm template ci helm/grainops --set ingress.enabled=true --set gatelimit.serviceMonitor=true --set postgres.enabled=false --set secrets.create=false --set secrets.existingSecret=s | ./kubeconform -strict -summary -ignore-missing-schemas
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - name: kubeshield -- fail the build on a real security finding, not just a schema error
        run: |
          go install github.com/sriharifortitude/kubeshield/cmd/kubeshield@v0.1.1
          helm template ci helm/grainops | kubeshield scan -
      - uses: helm/kind-action@v1
        with:
          cluster_name: grainops
      - run: bash scripts/k8s-smoke.sh
